<!DOCTYPE HTML>
<html>
 <head>
    <meta charset="utf-8">
  <meta name="width=device-width,inital-scale=1.0">
  <title>TIME CLOCK </title>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap');

.digital-clock{
    background-color: #000000;
    color: aliceblue;

    display: flex;
    border-radius: 2rem;
    user-select:none ;
    padding: 0 2rem;
    border: 0.5rem soild #141313;
animation-name:zoomInAnimation;
position: relative;
  animation-duration:1s;

}@keyframes zoomInAnimation {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.week {display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
width: 3rem;
color: #0f1a2b;
font-weight: bold;
font-family:"Science Gothic",sans-serif;}
.week .active {color: whitesmoke;}
.time{font-family: 'Orbitron', sans-serif; }
.hour,.min ,.dot {display:inline-block;font-size: 13rem;}
.min{display: math;}
.invsible{visibility: hidden;
}
body{
  background: linear-gradient(0deg,rgb(0, 0, 0) 0%, rgb(202, 41, 41) 100%);
 background-attachment: fixed;
  background-position: center;}
  </style>
  
  </head>
  <body>
<div class="digital-clock">
    <div class="week">
    <div class="active">SUN</div>
    <div>MON</div> 
    <div>TUE</div>
    <div>WED</div> 
    <div>THU</div> 
    <div>FRI</div> 
    <div>SAT</div>     
    </div>
    <div class="time">
        <div class="hour">12</div>
          <div class="dot">:</div>
          <div class="min">05</div>  
</div>
  </body><script>
const $ = (selector) => {
    return document.querySelector(selector);

}
const hour = $('.hour');
const dot= $('.dot');
const min = $('.min');
const week = $('.week');
let showDot = true;

function update(){
    showDot = !showDot;
    const now = new Date();
    if (showDot) {
        dot.classList.add('invsible');
    } else {
    dot.classList.remove('invsible');    
    }
    hour.textContent = String(now.getHours())
    .padStart(2,'0');
    min.textContent = String(now.getMinutes())
    .padStart(2, '0');
    Array
    .array.forEach(element => {
    ele.classList.remove('active');
    }
   );
 week 
 .children[now.getDay()]
 .classList
 .add('active'); 
};
setInterval(update, 500);
  </script>
  </html>
